name: Release

# Publish a GitHub Release whenever a version tag is pushed:
#   git tag v2.0.0 && git push origin v2.0.0
# Tags containing a hyphen (e.g. v2.0.0-pre.9) are marked as pre-releases.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write          # required for softprops/action-gh-release to publish

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Download ACT Binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory packages
          Invoke-WebRequest https://github.com/EQAditu/AdvancedCombatTracker/releases/latest/download/ACTv3.zip -OutFile packages/act.zip
          Expand-Archive -Path packages/act.zip -DestinationPath packages

      - name: Create empty fct-local feed dir
        shell: pwsh
        # nuget.config lists the sibling host's fct-local source, absent in CI. NuGet treats a
        # MISSING local source as fatal (NU1301), so create it empty — restore then falls through
        # to the committed fct-vendored feed (libs/fct/packages).
        run: New-Item -ItemType Directory -Force ..\ffxiv-combat-tracker\dist\debug\packages | Out-Null

      - name: Install bridge npm deps
        working-directory: DiscordBridge-node
        run: npm ci

      - name: Test bridge (Node)
        working-directory: DiscordBridge-node
        run: npm test

      - name: Build + package legacy (ACT net48) + bridge + zip
        shell: pwsh
        run: ./build.ps1 -Zip

      - name: Build + package modern (FCT net10) — vendored contract feed
        shell: pwsh
        # Reuses the bridge dist/ from build.ps1 (-SkipBridge); contracts come from libs/fct/packages.
        run: ./build_modern.ps1 -Configuration Release -Zip -SkipBridge

      - name: Run C# tests (net48 + net10)
        run: dotnet test ACT_DiscordTriggers.Tests/ACT_DiscordTriggers.Tests.csproj -c Release --nologo

      - name: Name archives after the tag
        shell: pwsh
        run: |
          Rename-Item ACT_DiscordTriggers.zip "ACT_DiscordTriggers-${{ github.ref_name }}.zip"
          Rename-Item release-modern/Fct.Plugins.DiscordTriggers.zip "Fct.Plugins.DiscordTriggers-${{ github.ref_name }}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ACT_DiscordTriggers-*.zip
            release-modern/Fct.Plugins.DiscordTriggers-*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            This release ships **two packages** — pick the one for your tracker:

            - **`ACT_DiscordTriggers-${{ github.ref_name }}.zip`** — for **Advanced Combat Tracker (ACT)** (net48 drop-in).
            - **`Fct.Plugins.DiscordTriggers-${{ github.ref_name }}.zip`** — for **FFXIV Combat Tracker (FCT)** (net10 native plugin).

            ## Installation (ACT)

            1. Download `ACT_DiscordTriggers-${{ github.ref_name }}.zip` from the **Assets** below.
            2. Right-click the downloaded zip → **Properties** → tick **Unblock** → OK.
               (Windows flags `node.exe`/DLLs from the internet; skipping this can trip SmartScreen/antivirus.)
            3. Extract it into your ACT plugins folder:
               `%AppData%\Advanced Combat Tracker\Plugins`
               You should end up with a `Plugins\ACT_DiscordTriggers\` folder containing
               `ACT_DiscordTriggers.dll`, `node.exe`, `bundle.js`, and `node_modules\`.
               **Keep all of these files together in that folder.**
            4. In ACT: **Plugins** tab → **Browse…** → select
               `ACT_DiscordTriggers.dll` inside that folder → **Add/Enable Plugin**.

            Then follow the
            [First-Time Setup Guide](https://github.com/jlagedo/ACT-Discord-Triggers/wiki/First-Time-Setup-Guide)
            to connect your Discord bot.

            > **Updating:** replace the whole `ACT_DiscordTriggers` folder, not just the `.dll`.

            ## Installation (FCT)

            1. Download `Fct.Plugins.DiscordTriggers-${{ github.ref_name }}.zip` from the **Assets** below.
            2. Right-click the downloaded zip → **Properties** → tick **Unblock** → OK.
            3. Extract it, then in **FFXIV Combat Tracker**: **Plugins** → **Add plugin** → point at the
               extracted `Fct.Plugins.DiscordTriggers\` folder.

            > **Updating:** replace the whole `Fct.Plugins.DiscordTriggers` folder, not just the `.dll`.

            ---
